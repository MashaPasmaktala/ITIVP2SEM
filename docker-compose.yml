# MongoDB для разработки: docker compose up -d
services:
  mongo:
    image: mongo:7
    container_name: blablacar-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db # данные сохраняются между перезапусками

  # Веб-интерфейс для просмотра базы: http://localhost:8081 (логин admin / пароль pass)
  mongo-express:
    image: mongo-express:1.0.2
    container_name: blablacar-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: pass
    depends_on:
      - mongo

volumes:
  mongo-data:
